# Railway 배포 설정.
# Dockerfile 이 있으면 Railway 가 자동으로 감지하지만, 헬스체크와 재시작 정책은
# 여기에 명시해야 한다.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# 이 경로가 200 을 돌려줘야 배포 성공으로 본다.
# Spring Boot 기동에 시간이 걸리므로 타임아웃을 넉넉히 잡는다.
healthcheckPath = "/actuator/health"
healthcheckTimeout = 120

restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
