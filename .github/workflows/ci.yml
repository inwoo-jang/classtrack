name: CI

# 푸시할 때마다 빌드가 깨지지 않았는지 확인한다.
# Railway·Vercel 배포는 각 서비스가 GitHub 연동으로 알아서 하고,
# 여기서는 "올리기 전에 깨진 걸 잡는" 역할만 한다.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: 백엔드 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # 컴파일과 테스트만 한다. DB 크리덴셜이 없으므로 앱을 띄우지는 않는다.
      - run: ./mvnw -B -q clean package -DskipTests

  frontend:
    name: 프론트엔드 빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # vue-tsc 로 타입까지 검사한다 — 백엔드 DTO 와 어긋나면 여기서 걸린다
      - run: npm run build
