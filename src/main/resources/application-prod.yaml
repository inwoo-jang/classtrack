# ============================================================
# 운영 환경. local 과 반대로 "덜 드러내는" 쪽으로 설정한다.
# ============================================================

spring:
  jpa:
    hibernate:
      # 운영에서 update 는 위험하다. 스키마가 안 맞으면 뜨지 않고 알려준다
      ddl-auto: validate
    show-sql: false

  web:
    error:
      # 내부 구조를 외부에 알려주지 않는다
      include-message: never
      include-binding-errors: never
      include-stacktrace: never

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.inwoo.classtrack: INFO

# app.developer 를 정의하지 않는다 -> /api/developer 는 404 를 돌려준다
#
# 프론트를 Vercel 에 따로 배포하므로 그 도메인을 CORS 허용 목록에 넣어야 한다.
# Railway 환경변수로 주입한다 (쉼표 구분, 와일드카드 가능):
#   CORS_ALLOWED_ORIGINS=https://classtrack.vercel.app,https://classtrack-*.vercel.app
