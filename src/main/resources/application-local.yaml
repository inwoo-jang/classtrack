# ============================================================
# 개발 환경. 관찰하기 쉬운 쪽으로 설정한다.
# ============================================================

spring:
  sql:
    init:
      # Neon도 임베디드 DB가 아니므로 local에서 data.sql을 명시적으로 실행한다.
      mode: always

  jpa:
    # Hibernate가 엔티티 테이블을 만든 다음 data.sql을 실행한다.
    defer-datasource-initialization: true
    hibernate:
      # 엔티티를 고치면 테이블도 따라 바뀐다. 개발 중에만 안전한 설정
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  web:
    error:
      # 검증 메시지를 화면에서 보여주기 위해 켠다
      include-message: always
      include-binding-errors: always
      include-stacktrace: never

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.inwoo.classtrack: DEBUG
    org.springframework.web: WARN

# ------------------------------------------------------------
# 개발자 정보. 개인정보라 저장소에 담지 않고 secrets.properties 에서 주입한다.
# 값이 없으면 /api/developer 는 404 를 돌려준다.
# ------------------------------------------------------------
app:
  # 개발 중에는 항상 켠다
  dev:
    enabled: true

  developer:
    name: ${DEV_NAME:}
    email: ${DEV_EMAIL:}
    role: ${DEV_ROLE:}
    organization: ${DEV_ORG:}
    github: ${DEV_GITHUB:}
